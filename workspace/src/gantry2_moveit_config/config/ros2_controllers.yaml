# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    axes_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

axes_controller:
  ros__parameters:
    joints:
      - map_to_xaxis
      - xaxis_to_yaxis
      - yaxis_to_zaxis
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity